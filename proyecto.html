<style>
    :root {
      color: #393530;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      background:
        linear-gradient(rgba(76, 71, 66, 0.58), rgb(43 41 39 / 78%)),
        url("public/rigoberto.jpeg") center / cover fixed no-repeat;
    }

    body:has(.poem-dialog[open]) {
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      z-index: 10;
      top: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem clamp(1.25rem, 4vw, 4rem);
      background: rgb(43 41 39 / 100%);
      border-bottom: 1px solid rgb(255 255 255 / 18%);
      color: #ffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .topbar-brand {
      color: #ffff;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .menu-toggle {
      display: none;
      padding: 0.45rem;
      background: transparent;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 0.25rem;
      color: #ffff;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      line-height: 2;
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible {
      background: rgb(255 255 255 / 13%);
    }

    .topbar nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1.25rem;
      margin: 0 0 0 auto;
      font-size: 0.95rem;
    }

    .topbar a {
      color: #e8e1d9;
      font-weight: 500;
      text-decoration: none;
    }

    .topbar a:hover,
    .topbar a:focus {
      color: #cdbda9;
    }

    @media (max-width: 700px) {
      .topbar {
        align-items: center;
        flex-wrap: wrap;
        gap: 0;
      }

      .menu-toggle {
        display: block;
      }

      .topbar nav {
        display: none;
        flex-direction: column;
        gap: 0;
        justify-content: flex-start;
        width: 100%;
        margin-top: 0.75rem;
        padding-top: 0.5rem;
        border-top: 1px solid rgb(255 255 255 / 18%);
      }

      .topbar.nav-open nav {
        display: flex;
      }

      .topbar nav a {
        padding: 0.65rem 0;
      }
    }

    main {
      min-height: 100vh;
      padding: 8rem 0 2rem;
    }

    .page-heading {
      margin: 0 2rem 2rem;
      color: #fff;
      font-size: clamp(2rem, 5vw, 4rem);
      text-align: center;
    }

    .poem-track {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2rem;
      width: min(76rem, 100%);
      margin: 0 auto;
      padding: 0 2rem 2rem;
    }

    .poem-card {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 24rem;
      margin: 0;
      padding: 2.5rem;
      background: url("public/paperofpoem.webp") center / 100% 100% no-repeat;
      cursor: pointer;
      text-align: center;
      transition: transform 180ms ease;
    }

    .poem-card:hover,
    .poem-card:focus-visible {
      transform: translateY(-0.25rem);
    }

    .poem-card h2 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      line-height: 1.1;
      text-align: center;
    }

    .poem-card pre {
      display: none;
    }

    .poem-dialog {
      width: min(42rem, calc(100% - 2rem));
      max-height: 90vh;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: #2b2724;
      /* xd */
    }

    .poem-dialog::backdrop {
      background: rgba(12, 12, 12, 0.76);
    }


    /* me voy a matar xd */
    .poem-dialog-content {
      position: relative;
      height: 88vh;
      min-height: 0;
      padding: clamp(4rem, 8vw, 6rem) clamp(3rem, 9vw, 6rem);
      overflow-y: auto;
      background: url("public/paperofpoem.webp") center / 100% 100% no-repeat;
      animation: paper-zoom 500ms cubic-bezier(0.2, 0.75, 0.25, 1);
    }

    @keyframes paper-zoom {
      from {
        opacity: 0;
        transform: scale(0.72);
        /* pipiipi */
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
     /* xd */
    .poem-dialog h2 {
      margin: 0 0 2rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      text-align: center;
    }

    .poem-dialog .poem-text {
      max-width: 30rem;
      margin: 2rem auto;
      white-space: pre-wrap;
      font: inherit;
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.8;
      text-align: center;
    }

    .poem-close {
      float: right;
      padding: 0.35rem 0.65rem;
      border: 1px solid #8f7c6a;
      background: transparent;
      color: #2b2724;
      cursor: pointer;
      font-size: 1.2rem;
    }

    @media (max-width: 700px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.5rem;
      }

      .topbar nav {
        justify-content: flex-start;
        gap: 0.75rem;
        width: 100%;
      }

      main {
        padding-top: 9rem;
      }

      .poem-track {
        grid-template-columns: 1fr;
        padding-right: 0.5rem;
        padding-left: 0.5rem;
      }

      .poem-card {
        width: calc(100vw - 1rem);
        min-height: 20rem;
        padding: 2.5rem 3rem;
      }

      .poem-dialog {
        width: calc(100% - 1rem);
        max-height: 92vh;
      }

      .poem-dialog-content {
        height: 89vh;
        min-height: 0;
        padding: 4rem 2.25rem;
      }
    }
  </style>
